plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.hello'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.hello"
        minSdk 24
        targetSdk 34
        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        buildConfigField "String", "CLOUD_RUN_URL", "\"${properties.getProperty('CLOUD_RUN_URL')}\""
        buildConfigField "String", "APP_SECRET_TOKEN", "\"${properties.getProperty('APP_SECRET_TOKEN')}\""
        buildConfigField "String", "WEB_CLIENT_ID", "\"${properties.getProperty('WEB_CLIENT_ID')}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}
dependencies {
    // Fragment や最新の機能を使うためのライブラリを追加
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ViewModel と LiveData を使うためのライブラリを追加
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    
    // Kotlinのバージョン衝突（Duplicate classエラー）を解決するためのBOMを追加
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // 通信ライブラリ OkHttp の追加
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    // Google Sign-In (Credential Manager) 用のライブラリ
    implementation 'androidx.credentials:credentials:1.2.1'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.1'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'
}
