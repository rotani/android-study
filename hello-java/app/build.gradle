plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.hello'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.hello"
        minSdk 24
        targetSdk 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
